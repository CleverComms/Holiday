<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff8e53"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Raccoon Face -->
  <g transform="translate(256, 250)">
    <!-- Ears -->
    <ellipse cx="-80" cy="-115" rx="38" ry="46" fill="#6b6b6b"/>
    <ellipse cx="80" cy="-115" rx="38" ry="46" fill="#6b6b6b"/>
    <ellipse cx="-80" cy="-115" rx="25" ry="32" fill="#f5e6d3"/>
    <ellipse cx="80" cy="-115" rx="25" ry="32" fill="#f5e6d3"/>

    <!-- Head shape -->
    <ellipse cx="0" cy="-25" rx="115" ry="100" fill="#8c8c8c"/>

    <!-- White face markings -->
    <ellipse cx="0" cy="5" rx="82" ry="70" fill="#f5f5f5"/>

    <!-- Dark mask around eyes -->
    <path d="M-90 -50 Q-65 -65 -35 -50 Q-18 -35 -35 -18 Q-65 0 -90 -18 Q-108 -35 -90 -50" fill="#2d2d2d"/>
    <path d="M90 -50 Q65 -65 35 -50 Q18 -35 35 -18 Q65 0 90 -18 Q108 -35 90 -50" fill="#2d2d2d"/>

    <!-- Eyes -->
    <ellipse cx="-55" cy="-38" rx="18" ry="20" fill="#fff"/>
    <ellipse cx="55" cy="-38" rx="18" ry="20" fill="#fff"/>
    <ellipse cx="-50" cy="-35" rx="10" ry="12" fill="#1a1a1a"/>
    <ellipse cx="50" cy="-35" rx="10" ry="12" fill="#1a1a1a"/>
    <!-- Eye shine -->
    <circle cx="-46" cy="-40" r="4" fill="#fff"/>
    <circle cx="46" cy="-40" r="4" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="0" cy="20" rx="16" ry="12" fill="#2d2d2d"/>
    <ellipse cx="0" cy="18" rx="6" ry="4" fill="#4a4a4a"/>

    <!-- Mouth -->
    <path d="M0 32 Q-12 44 -20 40" stroke="#2d2d2d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M0 32 Q12 44 20 40" stroke="#2d2d2d" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Cheek stripes -->
    <path d="M-82 15 Q-70 23 -58 20" stroke="#6b6b6b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-86 28 Q-74 36 -62 32" stroke="#6b6b6b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M82 15 Q70 23 58 20" stroke="#6b6b6b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M86 28 Q74 36 62 32" stroke="#6b6b6b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sunglasses on forehead -->
  <g transform="translate(256, 100)">
    <ellipse cx="-38" cy="0" rx="32" ry="24" fill="#1a1a1a" opacity="0.9"/>
    <ellipse cx="38" cy="0" rx="32" ry="24" fill="#1a1a1a" opacity="0.9"/>
    <rect x="-8" y="-4" width="16" height="8" rx="2" fill="#1a1a1a"/>
    <path d="M-70 -4 Q-84 -12 -92 -8" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M70 -4 Q84 -12 92 -8" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Lens shine -->
    <ellipse cx="-46" cy="-6" rx="10" ry="7" fill="#fff" opacity="0.2"/>
    <ellipse cx="30" cy="-6" rx="10" ry="7" fill="#fff" opacity="0.2"/>
  </g>

  <!-- Text -->
  <text x="256" y="430" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="2">HOLIBOBS</text>
  <text x="256" y="465" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff" text-anchor="middle" opacity="0.85" letter-spacing="4">TRAVEL MONEY</text>
</svg>
