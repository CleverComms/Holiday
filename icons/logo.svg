<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#skyGradient)" filter="url(#shadow)"/>

  <!-- Sun/Globe element -->
  <circle cx="256" cy="180" r="70" fill="url(#sunGradient)" opacity="0.9"/>

  <!-- Sun rays -->
  <g fill="#fff" opacity="0.6">
    <rect x="252" y="90" width="8" height="25" rx="4"/>
    <rect x="252" y="235" width="8" height="25" rx="4"/>
    <rect x="166" y="176" width="25" height="8" rx="4"/>
    <rect x="321" y="176" width="25" height="8" rx="4"/>
    <rect x="186" y="118" width="8" height="25" rx="4" transform="rotate(-45 190 130)"/>
    <rect x="318" y="118" width="8" height="25" rx="4" transform="rotate(45 322 130)"/>
    <rect x="186" y="218" width="8" height="25" rx="4" transform="rotate(45 190 230)"/>
    <rect x="318" y="218" width="8" height="25" rx="4" transform="rotate(-45 322 230)"/>
  </g>

  <!-- Currency symbols on globe -->
  <text x="230" y="190" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff" opacity="0.9">$</text>
  <text x="258" y="190" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff" opacity="0.9">€</text>
  <text x="244" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" opacity="0.7">£</text>
  <text x="244" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" opacity="0.7">¥</text>

  <!-- Palm tree silhouette -->
  <g fill="#fff" opacity="0.95">
    <!-- Trunk -->
    <path d="M200 380 Q205 320 210 280 Q212 270 208 270 Q204 270 206 280 Q200 320 195 380 Z"/>

    <!-- Leaves -->
    <ellipse cx="175" cy="265" rx="45" ry="12" transform="rotate(-30 175 265)"/>
    <ellipse cx="235" cy="265" rx="45" ry="12" transform="rotate(30 235 265)"/>
    <ellipse cx="165" cy="250" rx="40" ry="10" transform="rotate(-60 165 250)"/>
    <ellipse cx="245" cy="250" rx="40" ry="10" transform="rotate(60 245 250)"/>
    <ellipse cx="205" cy="235" rx="35" ry="10" transform="rotate(-10 205 235)"/>
  </g>

  <!-- Coin stack -->
  <g filter="url(#shadow)">
    <ellipse cx="340" cy="360" rx="50" ry="15" fill="url(#coinGradient)"/>
    <rect x="290" y="345" width="100" height="15" fill="url(#coinGradient)"/>
    <ellipse cx="340" cy="345" rx="50" ry="15" fill="url(#coinGradient)"/>
    <rect x="290" y="330" width="100" height="15" fill="url(#coinGradient)"/>
    <ellipse cx="340" cy="330" rx="50" ry="15" fill="url(#coinGradient)"/>
    <rect x="290" y="315" width="100" height="15" fill="url(#coinGradient)"/>
    <ellipse cx="340" cy="315" rx="50" ry="15" fill="#ffecd2"/>

    <!-- Currency symbol on top coin -->
    <text x="325" y="322" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#764ba2">$</text>
  </g>

  <!-- Airplane silhouette -->
  <g fill="#fff" opacity="0.9" transform="translate(350, 120) rotate(25)">
    <path d="M0 15 L60 15 L75 5 L75 25 L60 15 L0 15 Z"/>
    <path d="M20 15 L30 0 L35 0 L30 15 Z"/>
    <path d="M20 15 L30 30 L35 30 L30 15 Z"/>
    <path d="M55 15 L60 10 L62 10 L60 15 Z"/>
    <path d="M55 15 L60 20 L62 20 L60 15 Z"/>
  </g>

  <!-- Text -->
  <text x="256" y="440" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="3">HOLIDAY</text>
  <text x="256" y="470" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff" text-anchor="middle" opacity="0.8" letter-spacing="6">CURRENCY</text>
</svg>
