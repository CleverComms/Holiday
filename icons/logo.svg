<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff8e53"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Raccoon Face -->
  <g transform="translate(256, 240)">
    <!-- Ears -->
    <ellipse cx="-75" cy="-105" rx="35" ry="44" fill="#6b6b6b"/>
    <ellipse cx="75" cy="-105" rx="35" ry="44" fill="#6b6b6b"/>
    <ellipse cx="-75" cy="-105" rx="23" ry="30" fill="#f5e6d3"/>
    <ellipse cx="75" cy="-105" rx="23" ry="30" fill="#f5e6d3"/>

    <!-- Head shape -->
    <ellipse cx="0" cy="-20" rx="108" ry="92" fill="#8c8c8c"/>

    <!-- White face markings -->
    <ellipse cx="0" cy="5" rx="78" ry="66" fill="#f5f5f5"/>

    <!-- Dark mask around eyes -->
    <path d="M-88 -46 Q-62 -60 -32 -46 Q-17 -32 -32 -15 Q-62 2 -88 -15 Q-102 -32 -88 -46" fill="#2d2d2d"/>
    <path d="M88 -46 Q62 -60 32 -46 Q17 -32 32 -15 Q62 2 88 -15 Q102 -32 88 -46" fill="#2d2d2d"/>

    <!-- Eyes -->
    <ellipse cx="-52" cy="-35" rx="17" ry="19" fill="#fff"/>
    <ellipse cx="52" cy="-35" rx="17" ry="19" fill="#fff"/>
    <ellipse cx="-48" cy="-32" rx="9" ry="11" fill="#1a1a1a"/>
    <ellipse cx="48" cy="-32" rx="9" ry="11" fill="#1a1a1a"/>
    <!-- Eye shine -->
    <circle cx="-44" cy="-38" r="4" fill="#fff"/>
    <circle cx="44" cy="-38" r="4" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="0" cy="18" rx="15" ry="12" fill="#2d2d2d"/>
    <ellipse cx="0" cy="16" rx="6" ry="3" fill="#4a4a4a"/>

    <!-- Mouth -->
    <path d="M0 30 Q-12 42 -18 38" stroke="#2d2d2d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M0 30 Q12 42 18 38" stroke="#2d2d2d" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Cheek stripes -->
    <path d="M-78 14 Q-68 22 -56 19" stroke="#6b6b6b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-82 26 Q-72 33 -60 30" stroke="#6b6b6b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M78 14 Q68 22 56 19" stroke="#6b6b6b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M82 26 Q72 33 60 30" stroke="#6b6b6b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sunglasses on forehead -->
  <g transform="translate(256, 95)">
    <ellipse cx="-35" cy="0" rx="30" ry="22" fill="#1a1a1a" opacity="0.92"/>
    <ellipse cx="35" cy="0" rx="30" ry="22" fill="#1a1a1a" opacity="0.92"/>
    <rect x="-7" y="-3" width="14" height="6" rx="2" fill="#1a1a1a"/>
    <path d="M-65 -3 Q-76 -10 -82 -6" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M65 -3 Q76 -10 82 -6" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Lens shine -->
    <ellipse cx="-43" cy="-6" rx="8" ry="5" fill="#fff" opacity="0.15"/>
    <ellipse cx="27" cy="-6" rx="8" ry="5" fill="#fff" opacity="0.15"/>
  </g>

  <!-- Text -->
  <text x="256" y="420" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="2">HOLIBOBS</text>
  <text x="256" y="455" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff" text-anchor="middle" opacity="0.85" letter-spacing="4">TRAVEL MONEY</text>
</svg>
