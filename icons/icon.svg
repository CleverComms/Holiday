<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff8e53"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Raccoon Face -->
  <g transform="translate(256, 280)">
    <!-- Ears -->
    <ellipse cx="-95" cy="-140" rx="45" ry="55" fill="#6b6b6b"/>
    <ellipse cx="95" cy="-140" rx="45" ry="55" fill="#6b6b6b"/>
    <ellipse cx="-95" cy="-140" rx="30" ry="40" fill="#f5e6d3"/>
    <ellipse cx="95" cy="-140" rx="30" ry="40" fill="#f5e6d3"/>

    <!-- Head shape -->
    <ellipse cx="0" cy="-30" rx="140" ry="120" fill="#8c8c8c"/>

    <!-- White face markings -->
    <ellipse cx="0" cy="10" rx="100" ry="85" fill="#f5f5f5"/>

    <!-- Dark mask around eyes -->
    <path d="M-110 -60 Q-80 -80 -40 -60 Q-20 -40 -40 -20 Q-80 0 -110 -20 Q-130 -40 -110 -60" fill="#2d2d2d"/>
    <path d="M110 -60 Q80 -80 40 -60 Q20 -40 40 -20 Q80 0 110 -20 Q130 -40 110 -60" fill="#2d2d2d"/>

    <!-- Eyes -->
    <ellipse cx="-65" cy="-45" rx="22" ry="25" fill="#fff"/>
    <ellipse cx="65" cy="-45" rx="22" ry="25" fill="#fff"/>
    <ellipse cx="-60" cy="-42" rx="12" ry="14" fill="#1a1a1a"/>
    <ellipse cx="60" cy="-42" rx="12" ry="14" fill="#1a1a1a"/>
    <!-- Eye shine -->
    <circle cx="-55" cy="-48" r="5" fill="#fff"/>
    <circle cx="55" cy="-48" r="5" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="0" cy="25" rx="20" ry="15" fill="#2d2d2d"/>
    <ellipse cx="0" cy="22" rx="8" ry="5" fill="#4a4a4a"/>

    <!-- Mouth -->
    <path d="M0 40 Q-15 55 -25 50" stroke="#2d2d2d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0 40 Q15 55 25 50" stroke="#2d2d2d" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Cheek stripes -->
    <path d="M-100 20 Q-85 30 -70 25" stroke="#6b6b6b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-105 35 Q-90 45 -75 40" stroke="#6b6b6b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M100 20 Q85 30 70 25" stroke="#6b6b6b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M105 35 Q90 45 75 40" stroke="#6b6b6b" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sunglasses on forehead (holiday vibe!) -->
  <g transform="translate(256, 105)">
    <ellipse cx="-45" cy="0" rx="38" ry="28" fill="#1a1a1a" opacity="0.9"/>
    <ellipse cx="45" cy="0" rx="38" ry="28" fill="#1a1a1a" opacity="0.9"/>
    <rect x="-10" y="-5" width="20" height="10" rx="3" fill="#1a1a1a"/>
    <path d="M-83 -5 Q-100 -15 -110 -10" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M83 -5 Q100 -15 110 -10" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Lens shine -->
    <ellipse cx="-55" cy="-8" rx="12" ry="8" fill="#fff" opacity="0.2"/>
    <ellipse cx="35" cy="-8" rx="12" ry="8" fill="#fff" opacity="0.2"/>
  </g>
</svg>
